<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DealsSeeker.Mobile</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="DealsSeeker.Mobile.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
    <div class="status-bar-safe-area"></div>
    <div id="startup-splash" class="startup-host-splash" aria-hidden="true">
        <div class="startup-host-splash-content">
            <img src="/images/dealseeker-icon.svg" alt="" class="startup-host-splash-icon" />
            <p class="startup-host-splash-title" data-startup-text="appTitle">DealsSeeker</p>
            <p class="startup-host-splash-subtitle" data-startup-text="startupSubtitle">Find nearby deals instantly</p>
        </div>
    </div>
    <div id="app" class="app-host app-host-loading"></div>
    <div id="blazor-error-ui">
        <span data-startup-text="unhandledError">An unhandled error has occurred.</span>
        <a href="" class="reload" data-startup-text="reload">Reload</a>
        <a class="dismiss" data-startup-text="dismiss">🗙</a>
    </div>
    <script>
        (function () {
            var startupStartedAt = Date.now();
            var startupMinDurationMs = 2000;
            var startupRevealDelayMs = 450;
            var startupCompleted = false;
            var startupTranslations = {
                appTitle: "DealsSeeker",
                startupSubtitle: "Find nearby deals instantly",
                unhandledError: "An unhandled error has occurred.",
                reload: "Reload",
                dismiss: "Dismiss",
                mapTitle: "DealsSeeker map",
                mapUnavailable: "Map library unavailable. Please check network access."
            };

            function resolveStartupLanguage() {
                var locale = (navigator.language || "en").toLowerCase();
                return locale.indexOf("es") === 0 ? "es" : "en";
            }

            function applyStartupTranslations(translations) {
                Object.keys(translations).forEach(function (key) {
                    var nodes = document.querySelectorAll("[data-startup-text='" + key + "']");
                    nodes.forEach(function (node) {
                        node.textContent = translations[key];
                    });
                });
            }

            function loadStartupTranslations() {
                var language = resolveStartupLanguage();
                var resourcePath = "/localization/startup." + language + ".json";
                return fetch(resourcePath)
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error("startup localization fetch failed");
                        }

                        return response.json();
                    })
                    .then(function (translations) {
                        startupTranslations = Object.assign({}, startupTranslations, translations || {});
                        applyStartupTranslations(startupTranslations);
                    })
                    .catch(function () {
                        applyStartupTranslations(startupTranslations);
                    });
            }

            function revealApp() {
                var appHost = document.getElementById("app");
                if (appHost) {
                    appHost.classList.remove("app-host-loading");
                }
            }

            function removeStartupSplash() {
                var splash = document.getElementById("startup-splash");
                revealApp();

                if (!splash) {
                    return;
                }

                splash.classList.add("startup-host-splash-exit");
                window.setTimeout(function () {
                    if (splash.parentNode) {
                        splash.parentNode.removeChild(splash);
                    }
                }, startupRevealDelayMs);
            }

            function completeStartup() {
                if (startupCompleted) {
                    return;
                }

                startupCompleted = true;

                var elapsedMs = Date.now() - startupStartedAt;
                var remainingMs = Math.max(0, startupMinDurationMs - elapsedMs);
                window.setTimeout(removeStartupSplash, remainingMs);
            }

            window.DealsSeekerStartup = {
                complete: completeStartup
            };

            window.DealsSeekerMaps = (function () {
                var nextListenerId = 0;
                var listeners = new Map();

                function registerMarkerSelection(dotNetRef) {
                    var listenerId = "dealseeker-map-listener-" + (++nextListenerId);
                    var handler = function (event) {
                        if (!event || !event.data || event.data.type !== "dealseeker-map-marker-selected") {
                            return;
                        }

                        if (typeof event.data.lat !== "number" || typeof event.data.lng !== "number") {
                            return;
                        }

                        dotNetRef.invokeMethodAsync(
                            "HandleMapMarkerSelection",
                            event.data.lat,
                            event.data.lng,
                            event.data.name || "");
                    };

                    window.addEventListener("message", handler);
                    listeners.set(listenerId, handler);
                    return listenerId;
                }

                function unregisterMarkerSelection(listenerId) {
                    var handler = listeners.get(listenerId);
                    if (!handler) {
                        return;
                    }

                    window.removeEventListener("message", handler);
                    listeners.delete(listenerId);
                }

                return {
                    registerMarkerSelection: registerMarkerSelection,
                    unregisterMarkerSelection: unregisterMarkerSelection
                };
            })();

            function appendErrorDetails(message) {
                var host = document.getElementById("blazor-error-ui");
                if (!host || !message) {
                    return;
                }

                completeStartup();
                host.style.display = "block";

                var details = host.querySelector(".error-details");
                if (!details) {
                    details = document.createElement("pre");
                    details.className = "error-details";
                    host.appendChild(details);
                }

                details.textContent = message;
            }
            window.__appendErrorDetails = appendErrorDetails;

            window.addEventListener("error", function (event) {
                var location = "";
                if (event && event.filename) {
                    location = " at " + event.filename + ":" + (event.lineno || 0) + ":" + (event.colno || 0);
                }

                var stack = event && event.error && event.error.stack ? "\n" + event.error.stack : "";
                appendErrorDetails("window.error: " + (event && event.message ? event.message : "Unknown JS error") + location + stack);
            });

            window.addEventListener("unhandledrejection", function (event) {
                var reason = event ? event.reason : null;
                var message = reason && reason.message ? reason.message : String(reason);
                var stack = reason && reason.stack ? "\n" + reason.stack : "";
                appendErrorDetails("unhandledrejection: " + message + stack);
            });

            window.__patchBlazorStart = function () {
                if (!window.Blazor || typeof window.Blazor.start !== "function" || window.Blazor.__dealsSeekerStartWrapped) {
                    return;
                }

                var originalStart = window.Blazor.start.bind(window.Blazor);
                var started = false;

                window.Blazor.start = function () {
                    var stack = new Error("Blazor.start invocation").stack || "(no stack)";
                    if (started) {
                        var duplicateMessage = "Duplicate Blazor.start call blocked.\n" + stack;
                        console.warn(duplicateMessage);
                        appendErrorDetails(duplicateMessage);
                        return Promise.resolve();
                    }

                    started = true;
                    return originalStart.apply(window.Blazor, arguments).catch(function (error) {
                        var failureMessage = "Blazor.start failed: " + (error && error.message ? error.message : String(error)) + "\n" + stack;
                        appendErrorDetails(failureMessage);
                        throw error;
                    });
                };

                window.Blazor.__dealsSeekerStartWrapped = true;
            };

            loadStartupTranslations();
        })();
    </script>
    <script src="_framework/blazor.webview.js" autostart="false" onload="window.__patchBlazorStart && window.__patchBlazorStart()"></script>
</body>
</html>
