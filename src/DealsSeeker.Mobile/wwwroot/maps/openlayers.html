<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DealsSeeker OpenLayers Map</title>
    <link rel="stylesheet" href="/libs/openlayers/ol.css" />
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #edf3e7;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script src="/libs/openlayers/ol.js"></script>
<script>
    var startupTranslations = {
        mapTitle: "DealsSeeker map",
        mapUnavailable: "Map library unavailable. Please check network access."
    };

    function resolveStartupLanguage() {
        var locale = (navigator.language || "en").toLowerCase();
        return locale.indexOf("es") === 0 ? "es" : "en";
    }

    function loadStartupTranslations() {
        var resourcePath = "/localization/startup." + resolveStartupLanguage() + ".json";
        return fetch(resourcePath)
            .then(function (response) {
                if (!response.ok) {
                    throw new Error("startup localization fetch failed");
                }

                return response.json();
            })
            .then(function (translations) {
                startupTranslations = Object.assign({}, startupTranslations, translations || {});
                document.title = startupTranslations.mapTitle;
            })
            .catch(function () {
                document.title = startupTranslations.mapTitle;
            });
    }

    function toNumber(value, fallback) {
        var parsed = Number.parseFloat(value);
        return Number.isFinite(parsed) ? parsed : fallback;
    }

    function parseMarkerData(raw) {
        if (!raw) {
            return [];
        }

        var items = [];
        var entries = raw.split(";");
        for (var i = 0; i < entries.length; i++) {
            var entry = entries[i];
            if (!entry) {
                continue;
            }

            var parts = entry.split("|");
            if (parts.length < 2) {
                continue;
            }

            var lat = toNumber(parts[0], NaN);
            var lng = toNumber(parts[1], NaN);
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
                continue;
            }

            items.push({
                lat: lat,
                lng: lng,
                name: parts.length > 2 ? parts.slice(2).join("|") : "Business"
            });
        }

        return items;
    }

    var params = new URLSearchParams(window.location.search);
    var lat = toNumber(params.get("lat"), 40.7128);
    var lng = toNumber(params.get("lng"), -74.0060);
    var zoom = toNumber(params.get("zoom"), 14);
    var markerData = parseMarkerData(params.get("markers"));
    var showUser = params.get("showUser") !== "0";

    function initializeMap() {
        if (!window.ol || !ol.Map || !ol.layer || !ol.proj) {
            document.getElementById("map").innerHTML =
                "<div style='padding:16px;font-family:Arial,sans-serif;color:#1e3a2f;'>" + startupTranslations.mapUnavailable + "</div>";
            return;
        }

        var features = [];
        if (showUser) {
            var userFeature = new ol.Feature({
                geometry: new ol.geom.Point(ol.proj.fromLonLat([lng, lat]))
            });
            userFeature.set("isUserMarker", true);
            userFeature.setStyle(new ol.style.Style({
                image: new ol.style.Circle({
                    radius: 7,
                    fill: new ol.style.Fill({ color: "#2f6e46" }),
                    stroke: new ol.style.Stroke({ color: "#ffffff", width: 2 })
                })
            }));
            features.push(userFeature);
        }

        var markerFeatures = markerData.map(function (marker) {
            var feature = new ol.Feature({
                geometry: new ol.geom.Point(ol.proj.fromLonLat([marker.lng, marker.lat])),
                name: marker.name
            });
            feature.set("markerLat", marker.lat);
            feature.set("markerLng", marker.lng);

            feature.setStyle(new ol.style.Style({
                image: new ol.style.Circle({
                    radius: 6,
                    fill: new ol.style.Fill({ color: "#b23a3a" }),
                    stroke: new ol.style.Stroke({ color: "#ffffff", width: 2 })
                })
            }));

            return feature;
        });

        var vectorLayer = new ol.layer.Vector({
            source: new ol.source.Vector({
                features: features.concat(markerFeatures)
            })
        });

        var map = new ol.Map({
            target: "map",
            loadTilesWhileAnimating: false,
            loadTilesWhileInteracting: false,
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM({
                        transition: 0
                    })
                }),
                vectorLayer
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([lng, lat]),
                zoom: Math.max(2, Math.min(18, zoom)),
                enableRotation: false
            })
        });

        var controls = map.getControls && map.getControls();
        if (controls && typeof controls.clear === "function") {
            controls.clear();
        }

        map.on("pointermove", function (event) {
            var feature = map.forEachFeatureAtPixel(event.pixel, function (hitFeature) {
                return hitFeature;
            }, {
                hitTolerance: 10
            });

            var isMarker = feature && !feature.get("isUserMarker");
            map.getTargetElement().style.cursor = isMarker ? "pointer" : "";
        });

        map.on("singleclick", function (event) {
            var feature = map.forEachFeatureAtPixel(event.pixel, function (hitFeature) {
                return hitFeature;
            }, {
                hitTolerance: 10
            });

            if (!feature || feature.get("isUserMarker")) {
                return;
            }

            var markerLat = feature.get("markerLat");
            var markerLng = feature.get("markerLng");
            if (!Number.isFinite(markerLat) || !Number.isFinite(markerLng)) {
                return;
            }

            if (window.parent && typeof window.parent.postMessage === "function") {
                window.parent.postMessage({
                    type: "dealseeker-map-marker-selected",
                    lat: markerLat,
                    lng: markerLng,
                    name: feature.get("name") || ""
                }, "*");
            }
        });
    }

    loadStartupTranslations().finally(initializeMap);
</script>
</body>
</html>
