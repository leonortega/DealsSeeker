appId: com.anonymous.dealsseekerreactnative
---
- launchApp:
    clearState: true
- tapOn:
    text: "DealsSeeker"
    index: 1
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    point: "88%,47%"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 20000
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: "password1"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    point: "50%,76%"
- tapOn:
    text: "Got it"
    optional: true
- assertVisible: "Feed"
- tapOn: "Create"
- assertVisible: "Add Offer"
- swipe: { direction: UP }
- swipe: { direction: UP }
- tapOn: "Describe the offer"
- inputText: "coffee shop 50% discount"
- hideKeyboard
- evalScript: ${output.found = false}
- evalScript: ${output.n = 0}
- repeat:
    while:
      true: ${output.found == false && output.n < 12}
    commands:
      - runFlow:
          when:
            visible:
              id: "add-submit-button"
          commands:
            - evalScript: ${output.found = true}
      - evalScript: ${output.n = output.n + 1}
      - swipe: { start: "50%,90%", end: "50%,75%" }
- tapOn: { id: "add-submit-button" }
- extendedWaitUntil:
    visible: "Offer created."
    timeout: 20000
- assertVisible: "Feed"
