appId: com.anonymous.dealsseekerreactnative
---
- launchApp:
    clearState: true
- tapOn:
    text: "DealsSeeker"
    index: 1
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    point: "88%,47%"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 20000
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: "password1"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    point: "50%,76%"
- tapOn:
    text: "Got it"
    optional: true
- assertVisible: "Feed"
- scrollUntilVisible:
    element:
      id: "offer-report-button"
    direction: DOWN
- tapOn: { id: "offer-report-button" }
- assertVisible: "Reports"
- tapOn: "Report message"
- inputText: "Report from offer action"
- hideKeyboard
- evalScript: ${output.found = false}
- evalScript: ${output.n = 0}
- repeat:
    while:
      true: ${output.found == false && output.n < 8}
    commands:
      - runFlow:
          when:
            visible:
              id: "report-submit-button"
          commands:
            - evalScript: ${output.found = true}
      - evalScript: ${output.n = output.n + 1}
      - swipe: { start: "50%,85%", end: "50%,55%" }
- tapOn: { id: "report-submit-button" }
- assertVisible: "Report sent."
