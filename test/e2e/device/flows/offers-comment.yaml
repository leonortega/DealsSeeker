appId: com.anonymous.dealsseekerreactnative
---
- launchApp:
    clearState: true
- tapOn:
    text: "DealsSeeker"
    index: 1
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    point: "88%,47%"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 20000
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: "password1"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    point: "50%,76%"
- tapOn:
    text: "Got it"
    optional: true
- assertVisible: "Feed"
- tapOn: { text: "Use my location", optional: true }
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "offer-comments-button"
    direction: DOWN
- tapOn: { id: "offer-comments-button" }
- assertVisible: "Publish"
- inputText: "E2E device comment"
- tapOn: "Publish"
- assertVisible: "E2E device comment"
