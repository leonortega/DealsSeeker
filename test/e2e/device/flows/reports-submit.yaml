appId: com.anonymous.dealsseekerreactnative
---
- launchApp:
    clearState: true
- tapOn:
    text: "DealsSeeker"
    index: 1
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    point: "88%,47%"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 20000
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: "password1"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    point: "50%,76%"
- tapOn:
    text: "Got it"
    optional: true
- assertVisible: "Feed"
- tapOn: "Reports"
- tapOn: "Report message"
- inputText: "This offer looks outdated"
- hideKeyboard
- swipe: { start: "50%,75%", end: "50%,45%" }
- tapOn: "Send Report"
- assertVisible: "Report sent."
