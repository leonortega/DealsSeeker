appId: com.anonymous.dealsseekerreactnative
---
- launchApp:
    clearState: true
- tapOn:
    text: "DealsSeeker"
    index: 1
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    point: "88%,47%"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 20000
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: "password1"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    point: "50%,76%"
- tapOn:
    text: "Got it"
    optional: true
- assertVisible: "Feed"
- tapOn: "Map"
- tapOn: "Search by tag or keyword"
- inputText: "zzzznotreal"
- pressKey: Enter
- swipe: { direction: UP }
- extendedWaitUntil:
    visible: "No offers matched the current filters."
    timeout: 25000
- tapOn: "Clear filters"
- swipe: { direction: DOWN }
- assertVisible: "Nearby offers"
