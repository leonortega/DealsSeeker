appId: com.anonymous.dealsseekerreactnative
---
- launchApp
- tapOn:
    text: "DealsSeeker"
    index: 1
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    point: "88%,47%"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 20000
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: "password1"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    point: "50%,76%"
- tapOn:
    text: "Got it"
    optional: true
- assertVisible: "Feed"
- tapOn: "Map"
- tapOn: "Search by tag or keyword"
- inputText: "coffee"
- pressKey: Enter
- assertVisible: "Nearby offers"
- tapOn: "Feed"
- tapOn:
    text: "Got it"
    optional: true
- assertVisible: "Feed"
- tapOn: "Map"
- assertVisible: "coffee"
